{% extends 'base.html' %}
{% block title %}Editar Salón — NeoJardín{% endblock %}

{% block content %}
<section class="page-hero" id="editSalonHero">
    <div class="page-hero-bg"></div>
    <div class="container">
        <div class="page-hero-content">
            <span class="section-tag">Gestión</span>
            <h1>Editar Salón</h1>
            <p>Modifica los datos del salón seleccionado.</p>
        </div>
    </div>
</section>

<section class="section" id="editSalonSection">
    <div class="container">
        <div class="form-card" id="editSalonFormCard">
            <div class="form-card-header">
                <h2>{{ salon.nombre }}</h2>
                <a href="{{ url_for('main.salones') }}" class="btn-ghost-sm">← Volver</a>
            </div>
            <form method="POST" action="{{ url_for('main.editar_salon', id=salon.id) }}" id="editSalonForm">
                <div class="form-group">
                    <label for="nombre">Nombre del Salón</label>
                    <input type="text" id="nombre" name="nombre" value="{{ salon.nombre }}" required class="form-input">
                </div>
                <div class="form-group">
                    <label for="capacidad">Capacidad (personas)</label>
                    <input type="number" id="capacidad" name="capacidad" value="{{ salon.capacidad }}" min="1" required class="form-input">
                </div>
                <div class="form-group">
                    <label for="descripcion">Descripción</label>
                    <textarea id="descripcion" name="descripcion" rows="4" required class="form-textarea">{{ salon.descripcion }}</textarea>
                </div>
                <div class="form-group form-check">
                    <label class="checkbox-label" for="disponible">
                        <input type="checkbox" id="disponible" name="disponible" {% if salon.disponible %}checked{% endif %} class="form-checkbox">
                        <span class="checkmark"></span>
                        Salón disponible para reservas
                    </label>
                </div>
                <div class="form-actions">
                    <a href="{{ url_for('main.salones') }}" class="btn-ghost" id="cancelEditBtn">Cancelar</a>
                    <button type="submit" class="btn-primary" id="saveEditBtn">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
